name: Update data

on:
  schedule:
    # 05:30 UTC = 11:00 IST — after AMFI's daily NAVAll.txt publish and the
    # SEBI cutoffs for the previous business day (see DESIGN.md 5.4 in the
    # pipeline repo).
    - cron: '30 5 * * *'
  workflow_dispatch: {}

# The default GITHUB_TOKEN only needs write access to *this* repo — that's
# the whole reason this workflow lives in the data repo rather than the
# pipeline repo. No cross-repo PAT to create or rotate.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this data repo
        uses: actions/checkout@v4
        with:
          path: store

      - name: Check out the pipeline code
        uses: actions/checkout@v4
        with:
          repository: malavikasmenon/india-mf-explorer-web
          path: pipeline

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      # Run with CWD set to the data-repo checkout (not the pipeline
      # checkout) so the pipeline's relative "data/" writes land directly in
      # the tracked, full-history store rather than a throwaway directory —
      # that's also what lets build_manifest() see the complete dataset
      # (all past nav files, not just today's) rather than an empty one.
      - name: Fetch schemes, append today's NAV, refresh TER, rebuild the manifest
        working-directory: store
        env:
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: python -m scripts.run_daily

      - name: Commit and push
        id: commit
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Daily update: $(date -u +%Y-%m-%d)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # manifest.json, schemes.parquet, schemes.ingest.json, nav.ingest.json
      # and ter.ingest.json all sit at fixed paths rewritten every run, so a
      # stale CDN cache would hide new schemes/TER metadata from the
      # browser. nav/*.parquet is never purged: each day's file is a
      # brand-new URL nothing has cached yet - same reasoning covers ter's
      # *compacted* monthly/yearly files. But ter's *current-month* daily
      # files are different from nav's: build_ter() re-fetches and
      # overwrites every day published so far each run (see
      # pipelines/ter.py in the pipeline repo - there is no day-level
      # filter on the source, so it re-derives the whole month rather than
      # just today), so those specific files are overwritten in place, not
      # freshly created, and do need purging - read from what this run's
      # commit actually touched, since which files that is moves daily.
      - name: Purge jsDelivr cache for the files that changed
        if: steps.commit.outputs.pushed == 'true'
        working-directory: store
        run: |
          ter_files=$(git diff --name-only HEAD~1 HEAD | grep '^data/ter/.*\.parquet$' || true)
          paths='[
            "https://cdn.jsdelivr.net/gh/malavikasmenon/open-mf-data-india@main/data/manifest.json",
            "https://cdn.jsdelivr.net/gh/malavikasmenon/open-mf-data-india@main/data/schemes/schemes.parquet",
            "https://cdn.jsdelivr.net/gh/malavikasmenon/open-mf-data-india@main/data/schemes.ingest.json",
            "https://cdn.jsdelivr.net/gh/malavikasmenon/open-mf-data-india@main/data/nav.ingest.json",
            "https://cdn.jsdelivr.net/gh/malavikasmenon/open-mf-data-india@main/data/ter.ingest.json"
          ]'
          if [ -n "$ter_files" ]; then
            while IFS= read -r f; do
              paths=$(echo "$paths" | jq --arg url "https://cdn.jsdelivr.net/gh/malavikasmenon/open-mf-data-india@main/$f" '. + [$url]')
            done <<< "$ter_files"
          fi
          curl -s -X POST https://purge.jsdelivr.net/ \
            -H "Content-Type: application/json" \
            -d "{\"path\": $paths}"
